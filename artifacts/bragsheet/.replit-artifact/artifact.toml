kind = "web"
previewPath = "/"
title = "career_page"
version = "1.0.0"
id = "artifacts/bragsheet"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25144

[services.development]
run = "pnpm --filter @workspace/bragsheet run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bragsheet", "run", "build" ]
publicDir = "artifacts/bragsheet/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25144"
BASE_PATH = "/"
