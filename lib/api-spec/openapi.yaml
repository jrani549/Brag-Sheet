openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: BragSheet AI Career Page Builder API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bragsheet
    description: BragSheet AI career page operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /generate:
    post:
      operationId: generateProfile
      tags: [bragsheet]
      summary: Parse resume and generate structured career profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateProfileBody"
      responses:
        "200":
          description: Generated career profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerProfile"
        "400":
          description: Bad request
        "500":
          description: AI generation error

  /chat:
    post:
      operationId: chatAsCandidate
      tags: [bragsheet]
      summary: Recruiter chatbot — answers as the candidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatBody"
      responses:
        "200":
          description: Chatbot reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatReply"
        "400":
          description: Bad request
        "500":
          description: AI error

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    GenerateProfileBody:
      type: object
      properties:
        resume:
          type: string
          description: Full resume text
      required:
        - resume

    CareerProfile:
      type: object
      properties:
        name:
          type: string
        initials:
          type: string
        tag:
          type: string
        role:
          type: string
        summary:
          type: string
        meta:
          type: array
          items:
            type: string
        skills:
          type: array
          items:
            $ref: "#/components/schemas/Skill"
        techTags:
          type: array
          items:
            type: string
        experience:
          type: array
          items:
            $ref: "#/components/schemas/Experience"
        projects:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        certifications:
          type: array
          items:
            $ref: "#/components/schemas/Certification"
        socials:
          type: array
          items:
            $ref: "#/components/schemas/Social"
        chatSuggestions:
          type: array
          items:
            type: string
      required:
        - name
        - initials
        - tag
        - role
        - summary
        - meta
        - skills
        - techTags
        - experience
        - projects
        - certifications
        - socials
        - chatSuggestions

    Skill:
      type: object
      properties:
        name:
          type: string
        pct:
          type: integer
      required:
        - name
        - pct

    Experience:
      type: object
      properties:
        role:
          type: string
        company:
          type: string
        period:
          type: string
        bullets:
          type: array
          items:
            type: string
      required:
        - role
        - company
        - period
        - bullets

    Project:
      type: object
      properties:
        title:
          type: string
        desc:
          type: string
        tags:
          type: array
          items:
            type: string
      required:
        - title
        - desc
        - tags

    Certification:
      type: object
      properties:
        name:
          type: string
        org:
          type: string
        icon:
          type: string
      required:
        - name
        - org
        - icon

    Social:
      type: object
      properties:
        label:
          type: string
        handle:
          type: string
        bg:
          type: string
        color:
          type: string
        icon:
          type: string
      required:
        - label
        - handle
        - bg
        - color
        - icon

    ChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
      required:
        - role
        - content

    ChatBody:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        system:
          type: string
      required:
        - messages

    ChatReply:
      type: object
      properties:
        reply:
          type: string
      required:
        - reply
